<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MixoLabs</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.loader{border:4px solid #334155;border-top-color:#60a5fa;border-radius:50%;width:46px;height:46px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.checker{background-color:#0f172a;background-image:linear-gradient(45deg,#1e293b 25%,transparent 25%),linear-gradient(-45deg,#1e293b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1e293b 75%),linear-gradient(-45deg,transparent 75%,#1e293b 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.swatch.active,.family.active{outline:3px solid #818cf8;outline-offset:2px}

:root{--mixo-cyan:#22d3ee;--mixo-blue:#60a5fa;--mixo-violet:#8b5cf6;--mixo-pink:#e879f9}
body{background:
 radial-gradient(circle at 50% -15%,rgba(99,102,241,.16),transparent 34rem),
 radial-gradient(circle at 8% 28%,rgba(34,211,238,.06),transparent 24rem),
 #020617}
.mixolabs-wordmark{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-weight:900;letter-spacing:-.065em;font-size:clamp(2.4rem,6vw,4.7rem);line-height:1;text-shadow:0 0 28px rgba(99,102,241,.18)}
.mixolabs-wordmark .mixo{background:linear-gradient(100deg,#67e8f9 0%,#60a5fa 34%,#8b5cf6 67%,#e879f9 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mixolabs-wordmark .x{display:inline-block;font-style:italic;text-shadow:0 0 18px rgba(168,85,247,.6)}
.mixolabs-wordmark .labs{margin-left:.18em;letter-spacing:.08em;font-weight:500;background:linear-gradient(90deg,#e2e8f0,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:.72em}
aside,main section{box-shadow:0 18px 70px rgba(0,0,0,.22)}
button{transition:transform .15s ease,filter .15s ease,box-shadow .15s ease}
button:hover{filter:brightness(1.08)}
#generateBtn,#generateChosenAnglesBtn,#randomBtn{box-shadow:0 0 24px rgba(99,102,241,.14)}
#generateBtn:hover,#generateChosenAnglesBtn:hover,#randomBtn:hover{box-shadow:0 0 30px rgba(139,92,246,.25)}
.mixo-loader{width:min(520px,90%);text-align:center}
.mixo-loader-logo{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:clamp(2.3rem,7vw,4.5rem);font-weight:900;letter-spacing:-.055em;white-space:nowrap}
.mixo-loader-logo .letter{display:inline-block;color:#172033;text-shadow:none;animation:mixoReveal 2.2s ease-in-out infinite}
.mixo-loader-logo .letter:nth-child(1){animation-delay:0s}.mixo-loader-logo .letter:nth-child(2){animation-delay:.16s}.mixo-loader-logo .letter:nth-child(3){animation-delay:.32s}.mixo-loader-logo .letter:nth-child(4){animation-delay:.48s}.mixo-loader-logo .letter:nth-child(5){animation-delay:.64s;margin-left:.22em}.mixo-loader-logo .letter:nth-child(6){animation-delay:.80s}.mixo-loader-logo .letter:nth-child(7){animation-delay:.96s}.mixo-loader-logo .letter:nth-child(8){animation-delay:1.12s}
@keyframes mixoReveal{0%,12%{color:#172033;text-shadow:none;transform:translateY(2px)}38%,72%{color:#a5b4fc;text-shadow:0 0 12px #22d3ee,0 0 28px #8b5cf6;transform:translateY(0)}100%{color:#334155;text-shadow:none}}
.mixo-loader-line{height:2px;margin:16px auto 0;max-width:430px;background:linear-gradient(90deg,transparent,#22d3ee,#8b5cf6,#e879f9,transparent);background-size:220% 100%;animation:mixoSweep 1.4s linear infinite;box-shadow:0 0 18px rgba(139,92,246,.5)}
@keyframes mixoSweep{to{background-position:-220% 0}}


/* =========================================================
   MIXOLABS CINEMATIC SKIN — production visual layer
   ========================================================= */
:root{
 --mx-ink:#02040d;
 --mx-midnight:#050817;
 --mx-panel:#081127;
 --mx-panel2:#0b1530;
 --mx-line:rgba(105,190,255,.18);
 --mx-cyan:#12d9ff;
 --mx-blue:#3b82f6;
 --mx-violet:#8b5cf6;
 --mx-magenta:#f044ff;
 --mx-text:#f5f7ff;
 --mx-muted:#91a0c2;
}
html{background:#02040d}
body{
 color:var(--mx-text);
 background:
   radial-gradient(900px 520px at -8% 13%,rgba(21,91,255,.20),transparent 64%),
   radial-gradient(720px 520px at 104% 28%,rgba(240,68,255,.16),transparent 66%),
   radial-gradient(620px 420px at 74% 4%,rgba(67,56,202,.15),transparent 62%),
   linear-gradient(180deg,#02040d 0%,#040817 42%,#02040d 100%) !important;
 min-height:100vh;
 position:relative;
 overflow-x:hidden;
}
body:before,body:after{
 content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(4px)
}
body:before{
 width:440px;height:440px;left:-260px;top:180px;
 background:radial-gradient(circle,rgba(12,183,255,.22),rgba(56,23,190,.08) 45%,transparent 70%);
 box-shadow:180px 0 120px rgba(139,92,246,.07)
}
body:after{
 width:520px;height:520px;right:-310px;top:280px;
 background:radial-gradient(circle,rgba(240,68,255,.20),rgba(30,64,175,.08) 45%,transparent 72%)
}
.max-w-7xl{max-width:1460px}
.mixo-brand-header{display:flex;justify-content:center;align-items:center;margin:0 0 22px;padding:4px 0 0}
.mixo-brand-logo{
 width:min(760px,82vw);max-height:190px;object-fit:contain;
 filter:drop-shadow(0 0 16px rgba(35,211,238,.12)) drop-shadow(0 0 30px rgba(168,85,247,.10))
}
.grid.lg\:grid-cols-3{gap:24px}
aside,main section{
 position:relative;
 background:
 linear-gradient(180deg,rgba(10,19,43,.93),rgba(5,11,28,.96)) !important;
 border:1px solid rgba(84,164,255,.20) !important;
 border-radius:24px !important;
 box-shadow:
 0 32px 90px rgba(0,0,0,.46),
 0 0 0 1px rgba(139,92,246,.035),
 inset 0 1px 0 rgba(255,255,255,.035);
 backdrop-filter:blur(16px);
 overflow:hidden;
}
aside:before,main section:before{
 content:"";position:absolute;left:12%;right:12%;top:0;height:1px;
 background:linear-gradient(90deg,transparent,var(--mx-cyan),var(--mx-violet),var(--mx-magenta),transparent);
 opacity:.65;box-shadow:0 0 18px rgba(139,92,246,.55)
}
aside:after,main section:after{
 content:"";position:absolute;pointer-events:none;inset:0;
 background:
 radial-gradient(420px 190px at 12% -10%,rgba(18,217,255,.065),transparent 65%),
 radial-gradient(420px 210px at 95% 105%,rgba(240,68,255,.055),transparent 68%);
}
aside>* , main section>*{position:relative;z-index:1}
h2{
 font-size:1.24rem!important;letter-spacing:-.025em;
 background:linear-gradient(90deg,#fff,#b9d9ff 60%,#c4b5fd);
 -webkit-background-clip:text;background-clip:text;color:transparent;
}
h2:before{content:"✦";color:var(--mx-cyan);margin-right:.55rem;text-shadow:0 0 16px var(--mx-cyan)}
label{color:#cbd5e1!important;font-weight:650!important}
textarea,input,select{
 background:linear-gradient(180deg,rgba(2,6,23,.92),rgba(4,9,25,.88))!important;
 border:1px solid rgba(102,143,214,.25)!important;
 color:#f8fafc!important;
 border-radius:11px!important;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.018),0 6px 18px rgba(0,0,0,.12);
 transition:.18s ease;
}
textarea:hover,input:hover,select:hover{border-color:rgba(96,165,250,.42)!important}
textarea:focus,input:focus,select:focus{
 outline:none!important;border-color:rgba(18,217,255,.64)!important;
 box-shadow:0 0 0 3px rgba(18,217,255,.07),0 0 28px rgba(139,92,246,.12)!important
}
button{border:1px solid rgba(255,255,255,.07)!important;transition:.17s ease!important}
button:hover{transform:translateY(-1px);filter:brightness(1.08)}
#randomBtn{
 background:linear-gradient(95deg,#06b6d4 0%,#4f46e5 48%,#d946ef 100%)!important;
 box-shadow:0 10px 28px rgba(99,102,241,.22),0 0 24px rgba(217,70,239,.10)
}
#generateBtn{
 background:linear-gradient(95deg,#0ea5e9,#4f46e5 46%,#9333ea 72%,#e879f9)!important;
 border-color:rgba(192,132,252,.38)!important;
 box-shadow:0 13px 35px rgba(79,70,229,.30),0 0 28px rgba(217,70,239,.14)!important;
 min-height:50px;font-size:1rem
}
#generateChosenAnglesBtn{
 background:linear-gradient(95deg,#2563eb,#6366f1,#9333ea)!important;
 box-shadow:0 10px 26px rgba(99,102,241,.23)
}
#downloadBtn{background:linear-gradient(95deg,#047857,#0d9488)!important}
#fullscreenBtn,#backBtn,#clearBtn{background:linear-gradient(180deg,#334155,#1e293b)!important}
#addPhotos{background:linear-gradient(95deg,#2563eb,#4f46e5)!important}
#placeholder{
 border:1px dashed rgba(96,165,250,.17);border-radius:19px;
 background:
 radial-gradient(circle at 50% 38%,rgba(79,70,229,.08),transparent 16rem),
 linear-gradient(180deg,rgba(3,8,24,.36),rgba(2,6,23,.14));
 color:#7180a4!important
}
#grid{gap:18px!important}
#grid>div{
 background:linear-gradient(180deg,rgba(5,12,31,.9),rgba(3,8,21,.96))!important;
 border:1px solid rgba(96,165,250,.17)!important;
 border-radius:16px!important;
 box-shadow:0 14px 34px rgba(0,0,0,.28);
 overflow:hidden;transition:.17s ease
}
#grid>div:hover{
 transform:translateY(-3px);
 border-color:rgba(192,132,252,.40)!important;
 box-shadow:0 20px 44px rgba(0,0,0,.34),0 0 30px rgba(139,92,246,.11)
}
#activeArea h3,.mt-5 h3{
 color:#dbeafe!important;text-shadow:0 0 14px rgba(96,165,250,.22)
}
.checker{
 border:1px solid rgba(96,165,250,.17);
 border-radius:16px!important;
 box-shadow:inset 0 0 44px rgba(2,6,23,.5),0 15px 36px rgba(0,0,0,.22)
}
#activeArea .mt-5{
 background:linear-gradient(180deg,rgba(3,8,25,.78),rgba(7,10,31,.9))!important;
 border:1px solid rgba(139,92,246,.24)!important;
 box-shadow:0 14px 36px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.02)
}
#angleChoices label{
 display:flex;align-items:center;gap:5px;
 background:rgba(13,22,48,.72);border:1px solid rgba(96,165,250,.15);
 padding:8px 7px;border-radius:10px!important
}
#angleChoices input{accent-color:#a855f7}
.bg-slate-950.border.border-purple-900{
 background:linear-gradient(180deg,rgba(3,8,25,.86),rgba(8,7,30,.90))!important;
 border-color:rgba(192,132,252,.25)!important;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.02)
}
details{
 background:rgba(2,6,23,.62)!important;
 border-color:rgba(96,165,250,.14)!important
}
.swatch.active,.family.active{
 outline:2px solid #c084fc!important;outline-offset:2px;
 box-shadow:0 0 0 4px rgba(168,85,247,.10),0 0 24px rgba(168,85,247,.24)!important
}
#lightbox{background:rgba(0,0,0,.93)!important;backdrop-filter:blur(12px)}
/* Exact generated MixoLabs logo as progress animation */
.mixo-cinematic-loader{position:relative;width:min(760px,88%);height:250px;display:flex;align-items:center;justify-content:center}
.mixo-logo-ghost,.mixo-logo-reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.mixo-logo-ghost img,.mixo-logo-reveal img{width:100%;height:100%;object-fit:contain}
.mixo-logo-ghost{opacity:.11;filter:saturate(.55) brightness(.55)}
.mixo-logo-reveal{overflow:hidden;clip-path:inset(0 100% 0 0);animation:mixoExactReveal 3.2s ease-in-out infinite}
.mixo-logo-reveal img{filter:drop-shadow(0 0 14px rgba(34,211,238,.25)) drop-shadow(0 0 25px rgba(217,70,239,.18))}
@keyframes mixoExactReveal{
 0%{clip-path:inset(0 100% 0 0)}
 72%{clip-path:inset(0 0 0 0)}
 88%{clip-path:inset(0 0 0 0)}
 100%{clip-path:inset(0 100% 0 0)}
}
.mixo-loader-beam{
 position:absolute;left:5%;right:5%;bottom:28px;height:2px;
 background:linear-gradient(90deg,transparent,#12d9ff,#8b5cf6,#f044ff,transparent);
 background-size:240% 100%;animation:mixoBeam 1.6s linear infinite;
 box-shadow:0 0 20px rgba(139,92,246,.55)
}
@keyframes mixoBeam{to{background-position:-240% 0}}
.mixo-loader-copy{
 position:absolute;bottom:0;left:0;right:0;text-align:center;
 color:#b8c2df;letter-spacing:.18em;text-transform:uppercase;font-size:.72rem
}
@media(max-width:900px){
 .mixo-brand-logo{width:min(620px,94vw)}
 .mixo-cinematic-loader{height:190px}
}

</style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
<div class="max-w-7xl mx-auto p-4 md:p-8">
<header class="mixo-brand-header">
  <img class="mixo-brand-logo" src="/mixolabs-logo.png" alt="MixoLabs — Imagine • Generate • Create • Without Limits">
</header>

<div class="grid lg:grid-cols-3 gap-6">
<aside class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
<h2 class="text-xl font-bold">Generator Settings</h2>

<div>
<label class="text-xs font-semibold text-slate-300">Prompt / Idea</label>
<textarea id="prompt" rows="4" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-3" placeholder="Describe what you want to create..."></textarea>
<div class="flex gap-2 mt-2">
<button id="randomBtn" class="flex-1 bg-purple-700 hover:bg-purple-600 rounded-lg py-2 text-sm font-bold">🎲 Random Idea</button>
<button id="clearBtn" class="bg-slate-700 hover:bg-slate-600 rounded-lg px-4 text-sm">Clear</button>
</div>
</div>

<div>
<label class="text-xs font-semibold text-slate-300">Exact Text / Lettering (Optional)</label>
<input id="exactTextInput" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5" placeholder="Example: SMOKE">
</div>

<div class="grid grid-cols-2 gap-3">
<div><label class="text-xs font-semibold text-slate-300">Variations</label>
<select id="variationCountSelect" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5">
<option value="1">1 Image</option><option value="2">2 Images</option><option value="3">3 Images</option><option value="4">4 Images</option><option value="5">5 Images</option><option value="6" selected>6 Images</option>
</select></div>
<div><label class="text-xs font-semibold text-slate-300">Output Quality</label>
<select id="imageSizeSelect" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5">
<option value="512">512 — Economy</option><option value="1K" selected>1K — Standard</option><option value="2K">2K — High Quality</option><option value="4K">4K — Maximum</option>
</select></div>
</div>

<div><label class="text-xs font-semibold text-slate-300">Aspect Ratio</label>
<select id="aspectRatioSelect" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5">
<option>1:1</option><option>9:16</option><option>16:9</option><option>4:5</option><option>3:4</option><option>2:3</option><option>21:9</option>
</select></div>

<div><label class="text-xs font-semibold text-slate-300">Background</label>
<select id="backgroundSelect" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5">
<option value="contextual">Contextual Environment</option><option value="transparent">Isolated / clean white</option><option value="solid-black">Solid Black</option><option value="solid-white">Solid White</option><option value="studio-gradient">Studio Gradient</option>
</select></div>

<div class="border-t border-slate-800 pt-4">
<div class="flex justify-between items-center"><label class="text-xs font-semibold text-slate-300">Reference Images <span id="imageCount">0</span>/10</label><button id="addPhotos" class="bg-blue-700 px-3 py-1.5 rounded-lg text-xs font-bold">+ Add Photos</button></div>
<input id="multiImageUpload" type="file" accept="image/*" multiple class="hidden">
<div id="thumbs" class="grid grid-cols-5 gap-2 mt-2"></div>
</div>

<div>
<label class="text-xs font-semibold text-slate-300">Category</label>
<select id="categorySelect" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5"><option value="">Select Category (Optional)...</option></select>
</div>
<div>
<label class="text-xs font-semibold text-slate-300">Style</label>
<select id="styleSelect" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5"><option value="">Select Style (Optional)...</option></select>
</div>
<div>
<label class="text-xs font-semibold text-slate-300">Theme / Atmosphere</label>
<select id="themeSelect" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5"><option value="">Select Theme (Optional)...</option></select>
</div>

<div class="bg-slate-950 border border-purple-900 rounded-xl p-3">
<div class="flex justify-between"><span class="text-xs font-bold text-purple-300">🎨 Colour Family → 200 Shades</span><span id="selectedColor" class="text-xs text-purple-200">None</span></div>
<div id="families" class="grid grid-cols-4 gap-2 mt-3"></div>
<div id="shadePanel" class="hidden mt-3 border-t border-slate-800 pt-3">
<div class="flex justify-between mb-2"><span id="familyTitle" class="text-xs font-bold"></span><button id="clearColor" class="text-xs bg-slate-800 px-2 py-1 rounded">Clear</button></div>
<div id="shades" class="grid grid-cols-10 gap-1 max-h-48 overflow-y-auto"></div>
</div>
</div>

<details class="bg-slate-950 border border-slate-800 rounded-xl p-3">
<summary class="cursor-pointer text-sm font-bold">🧪 Resin Mixing Calculator</summary>
<div class="grid grid-cols-2 gap-2 mt-3">
<input id="resinTotal" type="number" value="100" min="0" class="bg-slate-900 border border-slate-700 rounded p-2" placeholder="Total grams">
<select id="resinRatio" class="bg-slate-900 border border-slate-700 rounded p-2"><option value="1">1:1</option><option value="2">2:1</option><option value="3">3:1</option></select>
</div><p id="resinResult" class="text-xs text-slate-300 mt-2"></p>
</details>

<button id="generateBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 py-3 rounded-xl font-black">✨ Generate Variations</button>
</aside>

<main class="lg:col-span-2 space-y-5">
<section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 min-h-[520px]">
<div id="loading" class="hidden h-96 flex flex-col items-center justify-center">
      <div class="mixo-cinematic-loader">
        <div class="mixo-logo-ghost"><img src="/mixolabs-logo.png" alt=""></div>
        <div class="mixo-logo-reveal"><img src="/mixolabs-logo.png" alt="MixoLabs"></div>
        <div class="mixo-loader-beam"></div>
        <p id="loadingText" class="mixo-loader-copy">Creating your image...</p>
      </div>
    </div>
    <div id="placeholder" class="h-96 flex items-center justify-center text-center text-slate-500">Your generated images will appear here.</div>
<div id="grid" class="hidden grid sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>

<div id="activeArea" class="hidden">
<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-blue-300">Active Masterpiece</h3><button id="backBtn" class="bg-slate-700 px-3 py-1.5 rounded text-xs">← Back to Grid</button></div>
<div class="checker rounded-xl p-3 flex justify-center"><img id="outputImage" class="max-h-[70vh] max-w-full object-contain rounded-lg cursor-zoom-in" alt="Generated image"></div>
<div class="grid sm:grid-cols-2 gap-2 mt-3"><button id="downloadBtn" class="bg-emerald-700 py-2 rounded-lg font-bold">Download Image</button><button id="fullscreenBtn" class="bg-slate-700 py-2 rounded-lg font-bold">Full Screen</button></div>

<div class="mt-5 bg-slate-950 border border-indigo-900 rounded-xl p-4">
<h3 class="font-bold text-indigo-300">Selected Angle Sheet</h3>
<p class="text-xs text-slate-400 mt-1">Choose any views. They are generated together in one Gemini image.</p>
<div class="grid grid-cols-3 sm:grid-cols-6 gap-2 mt-3" id="angleChoices">
<label class="text-xs"><input class="pre-angle-choice" type="checkbox" value="front" checked> Front</label>
<label class="text-xs"><input class="pre-angle-choice" type="checkbox" value="left" checked> Left</label>
<label class="text-xs"><input class="pre-angle-choice" type="checkbox" value="right" checked> Right</label>
<label class="text-xs"><input class="pre-angle-choice" type="checkbox" value="back" checked> Back</label>
<label class="text-xs"><input class="pre-angle-choice" type="checkbox" value="top"> Top</label>
<label class="text-xs"><input class="pre-angle-choice" type="checkbox" value="bottom"> Bottom</label>
</div>
<div id="preAngleCount" class="text-xs text-slate-400 mt-2">4 selected • 1 sheet generation</div>
<button id="generateChosenAnglesBtn" class="mt-3 w-full bg-indigo-700 hover:bg-indigo-600 py-2.5 rounded-lg font-bold">Generate Selected Angle Sheet</button>
</div>
</div>

<div id="angleArea" class="hidden mt-5"></div>
</section>
</main>
</div>
</div>

<div id="lightbox" class="hidden fixed inset-0 z-50 bg-black/95 p-4 items-center justify-center">
<button id="closeLightbox" class="absolute top-4 right-5 text-4xl">&times;</button>
<img id="lightboxImg" class="max-w-full max-h-full object-contain">
</div>

<script>
"use strict";

const STYLES = {
"3D & Product Models":["Photorealistic 3D Render","Product Visualization","Resin Model","Collectible Figurine","Toy Prototype","Industrial Design","Packaging Mockup","Jewellery Render","Ceramic Product","Glass Product","Metal Product","Wood Product","Clay Sculpture","Miniature Diorama"],
"Photorealistic":["Hyper-realistic","Cinematic Photography","Studio Portrait","Portrait Photography","Fashion Editorial","Macro Photography","Food Photography","Wildlife Photography","Landscape Photography","Architectural Photography","Street Photography","Night Photography","Aerial Photography","Vintage 35mm","Polaroid"],
"Cartoon & Animation":["Modern 3D Animation","Classic 2D Animation","Anime","Chibi","Kawaii","Claymation","Stop Motion","Comic Book","Graphic Novel","Saturday Morning Cartoon","Vector Mascot","Children's Illustration"],
"Art & Painting":["Oil Painting","Watercolour","Gouache","Acrylic Painting","Impressionism","Expressionism","Surrealism","Cubism","Renaissance","Baroque","Ukiyo-e","Pop Art","Art Nouveau","Art Deco","Minimalism"],

const COLOR_FAMILIES = {

Purple:[275,55],Red:[3,48],Brass:[43,42],Bronze:[30,32],Silver:[210,72],Gold:[46,52],Platinum:[210,82],Chrome:[205,78]

let uploadedImages=[], activeSelectedColor="", activeSelectedImage="";
const $=id=>document.getElementById(id);
const categorySelect=$("categorySelect"), styleSelect=$("styleSelect"), themeSelect=$("themeSelect");

function initSelectors(){
categorySelect.innerHTML='<option value="">Select Category (Optional)...</option>';
Object.keys(STYLES).forEach(c=>categorySelect.add(new Option(c,c)));
themeSelect.innerHTML='<option value="">Select Theme (Optional)...</option>';
THEMES.forEach(t=>themeSelect.add(new Option(t,t)));
styleSelect.innerHTML='<option value="">Select Style (Optional)...</option>';
}
categorySelect.addEventListener("change",()=>{
styleSelect.innerHTML='<option value="">Select Style (Optional)...</option>';
(STYLES[categorySelect.value]||[]).forEach(s=>styleSelect.add(new Option(s,s)));
});

function initColors(){
const host=$("families"); host.innerHTML="";
Object.entries(COLOR_FAMILIES).forEach(([name,[h,l]])=>{
const b=document.createElement("button"); b.type="button"; b.className="family text-[10px] rounded p-2 border border-slate-700";
b.textContent=name;b.style.background=`hsl(${h} 45% ${l}%)`;b.style.color=(l>65?"#111":"#fff");
b.onclick=()=>showShades(name,h,l,b);host.appendChild(b);
});
}
function showShades(name,h,baseL,btn){
document.querySelectorAll(".family").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
$("shadePanel").classList.remove("hidden");$("familyTitle").textContent=`${name} — 200 Shades`;
const host=$("shades");host.innerHTML="";
for(let i=0;i<200;i++){
const sat=(name==="Black"||name==="White"||name==="Grey"||name==="Silver"||name==="Platinum"||name==="Chrome")?Math.min(18,(i%20)):Math.min(100,45+(i%20)*2.7);
let light;
if(name==="Black") light=3+(i/199)*28;
else if(name==="White") light=72+(i/199)*27;
else light=10+(i/199)*80;
const hue=(h+Math.floor(i/20)*1.3)%360;
const css=`hsl(${hue} ${sat}% ${light}%)`;
const b=document.createElement("button");b.type="button";b.className="swatch h-5 rounded border border-slate-800";b.style.background=css;b.title=`${name} Shade ${i+1}`;
b.onclick=()=>{document.querySelectorAll(".swatch").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeSelectedColor=`${name} Shade ${i+1} (${css})`;$("selectedColor").textContent=`${name} #${i+1}`;};
host.appendChild(b);
}
}
$("clearColor").onclick=()=>{activeSelectedColor="";$("selectedColor").textContent="None";$("shadePanel").classList.add("hidden");document.querySelectorAll(".family").forEach(x=>x.classList.remove("active"));};

$("addPhotos").onclick=()=>$("multiImageUpload").click();
$("multiImageUpload").addEventListener("change",async e=>{
const files=[...e.target.files].slice(0,10-uploadedImages.length);
for(const f of files){uploadedImages.push(await fileToDataURL(f));}
renderThumbs();e.target.value="";
});
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
function renderThumbs(){
$("thumbs").innerHTML="";uploadedImages.forEach((src,i)=>{const d=document.createElement("div");d.className="relative";d.innerHTML=`<img src="${src}" class="w-full aspect-square object-cover rounded"><button class="absolute -top-1 -right-1 bg-red-600 rounded-full w-5 h-5 text-xs" data-i="${i}">×</button>`;$("thumbs").appendChild(d);});
$("thumbs").querySelectorAll("button").forEach(b=>b.onclick=()=>{uploadedImages.splice(+b.dataset.i,1);renderThumbs();});
$("imageCount").textContent=uploadedImages.length;
}

function dataPart(url){const m=String(url).match(/^data:([^;]+);base64,(.+)$/);return m?{inlineData:{mimeType:m[1],data:m[2]}}:null;}
async function callGemini(promptText, refs=[], ratio=null, size=null){
const parts=[{text:promptText}];refs.forEach(r=>{const p=dataPart(r);if(p)parts.push(p);});
const payload={contents:[{role:"user",parts}],generationConfig:{responseModalities:["IMAGE"],imageConfig:{aspectRatio:ratio||$("aspectRatioSelect").value,imageSize:size||$("imageSizeSelect").value}}};
const response=await fetch("/api/gemini/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
let result={};try{result=await response.json();}catch{}
if(!response.ok)throw new Error(result?.error?.message||result?.error||`Request failed (${response.status})`);
const image=result?.candidates?.[0]?.content?.parts?.find(p=>p.inlineData)?.inlineData;
if(!image)throw new Error("Gemini did not return an image.");
return `data:${image.mimeType};base64,${image.data}`;
}

function buildPrompt(variation){
const p=$("prompt").value.trim()||"Create an original, visually compelling subject.";
const exact=$("exactTextInput").value.trim();
const bg=$("backgroundSelect").selectedOptions[0]?.textContent||"";
return `${p}
${categorySelect.value?`Category: ${categorySelect.value}.`:""}
${styleSelect.value?`Visual style: ${styleSelect.value}.`:""}
${themeSelect.value?`Theme/atmosphere: ${themeSelect.value}.`:""}
${activeSelectedColor?`Primary colour direction: ${activeSelectedColor}. Preserve the intended material/metallic appearance when relevant.`:""}
Background direction: ${bg}.
${exact?`EXACT VISIBLE TEXT: "${exact}". Render this wording exactly, with no spelling changes.`:""}
Variation ${variation}. Preserve reference-image identity/details when references are supplied.
Create an original composition with strong detail, coherent lighting and professional finish.`;
}

$("generateBtn").onclick=async()=>{
const count=+$("variationCountSelect").value;
$("placeholder").classList.add("hidden");$("activeArea").classList.add("hidden");$("angleArea").classList.add("hidden");$("grid").classList.remove("hidden");$("grid").innerHTML="";
$("loading").classList.remove("hidden");$("loadingText").textContent=`Generating ${count} variation${count===1?"":"s"}...`;
for(let i=1;i<=count;i++){
const card=document.createElement("div");card.className="bg-slate-950 border border-slate-800 rounded-xl p-3 min-h-52 flex items-center justify-center";card.innerHTML=`<span class="text-xs text-slate-500">Generating #${i}...</span>`;$("grid").appendChild(card);
try{const url=await callGemini(buildPrompt(i),uploadedImages);card.innerHTML=`<img src="${url}" class="w-full rounded-lg cursor-pointer" alt="Variation ${i}"><div class="grid grid-cols-2 gap-2 mt-2 w-full"><button class="select bg-blue-700 py-1.5 rounded text-xs font-bold">Select</button><button class="dl bg-slate-700 py-1.5 rounded text-xs font-bold">Download</button></div>`;card.querySelector("img").onclick=card.querySelector(".select").onclick=()=>selectImage(url);card.querySelector(".dl").onclick=()=>download(url,`mixolabs-variation-${i}.png`);}
catch(e){card.innerHTML=`<div class="text-red-400 text-xs text-center">Variation ${i} failed<br>${escapeHtml(e.message)}</div>`;}
}
$("loading").classList.add("hidden");
};

function selectImage(url){activeSelectedImage=url;$("outputImage").src=url;$("grid").classList.add("hidden");$("activeArea").classList.remove("hidden");$("angleArea").classList.add("hidden");}
$("backBtn").onclick=()=>{$("activeArea").classList.add("hidden");$("angleArea").classList.add("hidden");$("grid").classList.remove("hidden");};
$("downloadBtn").onclick=()=>activeSelectedImage&&download(activeSelectedImage,"mixolabs-masterpiece.png");
function download(url,name){const a=document.createElement("a");a.href=url;a.download=name;a.click();}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}

function selectedAngles(){return [...document.querySelectorAll(".pre-angle-choice:checked")].map(x=>x.value);}
function updateAngleCount(){const n=selectedAngles().length;$("preAngleCount").textContent=n?`${n} selected • 1 sheet generation`:"0 selected • 0 sheet generations";}
document.querySelectorAll(".pre-angle-choice").forEach(x=>x.onchange=updateAngleCount);

$("generateChosenAnglesBtn").onclick=async()=>{
if(!activeSelectedImage)return alert("Select a generated image first.");
const views=selectedAngles();if(!views.length)return alert("Select at least one angle.");
const labels={front:"FRONT",left:"LEFT PROFILE",right:"RIGHT PROFILE",back:"BACK",top:"TOP",bottom:"BOTTOM"};
const requested=views.map(v=>labels[v]);
$("loading").classList.remove("hidden");$("loadingText").textContent=`Generating one angle sheet with ${views.length} selected views...`;
try{
const prompt=`CREATE ONE SINGLE PROFESSIONAL TURNAROUND / ANGLE SHEET IMAGE.
Use the supplied reference image as the absolute visual reference.
Include ONLY these requested views: ${requested.join(", ")}.
Put all requested views together inside ONE image in a clean model-sheet grid and clearly label each view.
IDENTITY LOCK: every panel must show the same subject. Preserve face, body proportions, fur/hair, markings, clothing, accessories, colours, materials, textures and distinctive details. Do not redesign or simplify.
ANGLE DIRECTIONS ARE CAMERA-CRITICAL:
FRONT = camera directly in front of the subject, 0 degrees.
LEFT PROFILE = the SUBJECT'S ANATOMICAL LEFT SIDE. Camera is positioned exactly 90 degrees to the subject's LEFT side, showing the subject's left ear/left cheek/left side. True side elevation only.
RIGHT PROFILE = the SUBJECT'S ANATOMICAL RIGHT SIDE. Camera is positioned exactly 90 degrees to the subject's RIGHT side, showing the subject's right ear/right cheek/right side. True side elevation only.
BACK = camera directly behind the subject, 180 degrees.
TOP = camera directly overhead, looking vertically down.
BOTTOM = camera directly underneath, looking vertically up.
LEFT and RIGHT must be opposite sides of the SAME subject. Do not mirror one panel to fake the other side. Do not use three-quarter, 45-degree, turned, oblique or perspective profile views. Keep the camera height, subject scale and pose consistent across the horizontal views.
Keep the subject fully visible. Preserve photorealism and fine surface detail. Neutral studio background. No extra or duplicate views.`;
const url=await callGemini(prompt,[activeSelectedImage],"16:9");
$("angleArea").innerHTML=`<div class="border-t border-slate-800 pt-5"><div class="flex justify-between items-center"><h3 class="font-bold text-indigo-300">Angle Sheet</h3><button id="backFromAngles" class="bg-slate-700 px-3 py-1.5 rounded text-xs">Back to Masterpiece</button></div><p class="text-xs text-slate-400 my-2">${requested.join(" • ")}</p><div class="checker rounded-xl p-3 flex justify-center"><img id="angleSheetImage" src="${url}" class="max-w-full max-h-[75vh] object-contain rounded-lg cursor-zoom-in"></div><button id="downloadAngleSheet" class="mt-3 bg-emerald-700 px-4 py-2 rounded-lg font-bold">Download Angle Sheet</button></div>`;
$("activeArea").classList.add("hidden");$("angleArea").classList.remove("hidden");
$("downloadAngleSheet").onclick=()=>download(url,"mixolabs-angle-sheet.png");$("backFromAngles").onclick=()=>{$("angleArea").classList.add("hidden");$("activeArea").classList.remove("hidden");};$("angleSheetImage").onclick=()=>openLightbox(url);
}catch(e){alert(`Angle sheet failed: ${e.message}`);}
finally{$("loading").classList.add("hidden");}
};

const randomSubjects=["a tiny fantasy creature","a luxury perfume bottle","a futuristic vehicle","a whimsical woodland character","a dramatic wildlife portrait","an original collectible figure","an enchanted cottage","a surreal botanical sculpture","a premium sneaker concept","a cinematic robot companion"];

function resin(){const total=Math.max(0,+$("resinTotal").value||0),a=+$("resinRatio").value,b=1,part=total/(a+b);$("resinResult").textContent=`Part A: ${(part*a).toFixed(1)} g • Part B: ${(part*b).toFixed(1)} g`;}
